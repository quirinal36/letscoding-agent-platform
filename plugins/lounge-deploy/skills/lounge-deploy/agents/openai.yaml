interface:
  display_name: "Lounge Deploy"
  short_description: "라운지용 정적 ZIP을 빌드하고 최신 정책으로 검증"
  default_prompt: "Use $lounge-deploy to create and validate a Lounge upload ZIP for this project."
dependencies:
  tools:
    - type: "mcp"
      value: "lounge-deploy"
      description: "Latest Lounge policy, project analysis, artifact validation, and reports"
      transport: "streamable_http"
      url: "https://lounge-deploy-mcp.letscoding.kr/mcp"
policy:
  allow_implicit_invocation: true
